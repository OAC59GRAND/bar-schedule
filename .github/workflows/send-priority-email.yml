name: Send Weekly Priority Team Schedule Email

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write email script
        run: |
          cat > email_script.js << 'ENDSCRIPT'
          const https = require('https');

          const fs = require('fs');
          // Single source of truth, shared with priority-schedule.html.
          const TEAMS = JSON.parse(fs.readFileSync('teams.json', 'utf8'));
          // Same fallback map the board uses, so email and screen agree.
          let LEAGUE_CH = {};
          try {
            LEAGUE_CH = JSON.parse(fs.readFileSync('league-channels.json','utf8')).defaults || {};
          } catch (e) {
            console.warn('league-channels.json unreadable; blank channels will show:', e.message);
          }

          const CH = {
            'FOX':'Ch 2','CBS':'Ch 5','ABC':'Ch 7','NBC':'Ch 11','Telemundo':'Ch 406',
            'ESPN':'Ch 206','ESPN2':'Ch 209','ESPN Unlmtd':'Ch 206','ESPNU':'Ch 208',
            'FS1':'Ch 219','TNT':'Ch 245','TBS':'Ch 247','truTV':'Ch 246',
            'NFL Network':'Ch 212','MLB Network':'Ch 213','NHL Network':'Ch 215','NBA TV':'Ch 216',
            'Golf Channel':'Ch 218','CBS Sports Network':'Ch 221','CBSSN':'Ch 221',
            'USA Network':'Ch 242','USA Net':'Ch 242','ION':'Ch 305',
            'NBC Sports Bay Area':'Ch 696',
          };
          const MLB_CH = {
            'Giants':'NBC Sports Bay Area Ch 696','Dodgers':'Spectrum SportsNet LA Ch 690',
            'Angels':'Angels Bcast TV Ch 692','Padres':'Padres.TV Ch 694',
            'Mariners':'Mariners.TV Ch 687','Cardinals':'Cardinals.TV Ch 672',
            'Royals':'Royals.TV Ch 671','Cubs':'Marquee Ch 664',
            'White Sox':'Chicago SN Ch 665','Astros':'Space City HN Ch 674',
            'Rangers':'Rangers SN Ch 677','Yankees':'YES Network Ch 631',
            'Mets':'SNY Ch 639','Red Sox':'NESN Ch 628','Orioles':'MASN Ch 640',
            'Nationals':'Nationals.TV Ch 641','Braves':'BravesVision Ch 645',
            'Rays':'Rays.TV Ch 652','Marlins':'Marlins.TV Ch 655',
            'Pirates':'SportsNet PIT Ch 659','Reds':'Reds.TV Ch 661',
            'Guardians':'Guardians.TV Ch 662','Tigers':'Detroit SN Ch 663',
            'Brewers':'Brewers.TV Ch 670','Twins':'Twins.TV Ch 668',
            'Rockies':'Rockies.TV Ch 683','Diamondbacks':'DBACKS.TV Ch 686',
          };

          function getChannel(broadcast, hf, af, league) {
            if (!broadcast) {
              const f = LEAGUE_CH[league];
              return f ? f.default : '';
            }
            if (/mlb\.?tv/i.test(broadcast)) {
              for (const [k,v] of Object.entries(MLB_CH))
                if ((hf+af).includes(k)) return v;
              return 'MLB.TV';
            }
            if (/espn.?unl/i.test(broadcast)) return 'ESPN Ch 206';
            if (/^usa.?net/i.test(broadcast)) return 'USA Network Ch 242';
            if (/^cbssn$/i.test(broadcast))   return 'CBS Sports Net Ch 221';
            if (/^ion$/i.test(broadcast))      return 'ION Ch 305';
            if (/peacock/i.test(broadcast))    return 'Peacock';
            if (/paramount/i.test(broadcast))  return 'Paramount+';
            if (/espn\+|espnplus/i.test(broadcast)) return 'ESPN+ (Roku)';
            if (/prime|amazon/i.test(broadcast))    return 'Amazon Prime';
            if (/apple/i.test(broadcast))      return 'Apple TV';
            if (/fandango/i.test(broadcast))   return 'Fandango (Free)';
            if (/hometeam/i.test(broadcast))   return 'HomeTeam Network';
            const ch = CH[broadcast.trim()];
            return ch ? broadcast.trim()+' '+ch : broadcast;
          }

          function fetchJSON(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {headers:{'User-Agent':'OAC-Bot/1.0'}}, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(e); } });
              }).on('error', reject);
            });
          }

          function matches(ev, team) {
            // Must scope by league: name matching is a substring test, so
            // 'Giants' otherwise pulls NY Giants (NFL) into the SF Giants row.
            const allowed = team.leagues || [team.league];
            if (!allowed.includes(ev.league)) return false;
            const both = ((ev.homeFull||'')+(ev.awayFull||'')).toLowerCase();
            return team.matches.some(m => both.includes(m.toLowerCase()));
          }
          function homeTeam(ev, team) {
            return team.matches.some(m => (ev.homeFull||'').toLowerCase().includes(m.toLowerCase()));
          }
          function opponent(ev, team) {
            return homeTeam(ev,team) ? (ev.awayFull||ev.away||'') : (ev.homeFull||ev.home||'');
          }

          const DAYS  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          const MONS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

          // CRITICAL: this runs on a GitHub runner, whose clock is UTC. Date
          // methods like getHours()/getDay() therefore return UTC values. The
          // old code read those and appended " PT", shifting every game 7-8
          // hours and rolling evening games onto the wrong day. Everything
          // user-facing must go through an explicit America/Los_Angeles
          // formatter — never getHours(), getDay(), getDate() or getMonth().
          const PT = 'America/Los_Angeles';
          const PT_PARTS = new Intl.DateTimeFormat('en-US', {
            timeZone: PT, weekday:'short', month:'short', day:'numeric',
            hour:'numeric', minute:'2-digit', hour12:true
          });
          const PT_KEY = new Intl.DateTimeFormat('en-CA', {
            timeZone: PT, year:'numeric', month:'2-digit', day:'2-digit'
          });

          function ptParts(iso) {
            const out = {};
            for (const p of PT_PARTS.formatToParts(new Date(iso))) out[p.type] = p.value;
            return out;
          }
          // YYYY-MM-DD in Pacific. Sorts and compares as a plain string.
          function ptKey(iso) { return PT_KEY.format(new Date(iso)); }

          function fmtTime(iso) {
            const p = ptParts(iso);
            return p.hour + (p.minute !== '00' ? ':' + p.minute : '') + ' ' + p.dayPeriod + ' PT';
          }
          function fmtDay(iso)  { return ptParts(iso).weekday; }
          function fmtDate(iso) { const p = ptParts(iso); return p.month + ' ' + p.day; }

          async function main() {
            const data = await fetchJSON('https://oac59grand.github.io/bar-schedule/schedule.json');
            const all = [];
            for (const evs of Object.values(data.days||{})) for (const ev of evs) all.push(ev);
            all.sort((a,b) => new Date(a.isoDate) - new Date(b.isoDate));

            // Anchor the week to the Pacific date, not the runner's UTC date.
            // A Monday 15:00 UTC send is Monday 08:00 PT, but a UTC-based
            // "today" flips a day early on any send after 5pm PT.
            const now = new Date();
            const end = new Date(now.getTime() + 6*86400000);
            const weekLabel = fmtDate(now) + ' - ' + fmtDate(end) + ', ' + ptKey(end).slice(0,4);

            // schedule.json carries ~5 weeks so the board can page through
            // weeks. The email is a ONE WEEK digest — clamp it here or the
            // send balloons to every fixture a month out.
            const startKey = ptKey(now);
            const endKey   = ptKey(end);
            const thisWeek = all.filter(ev => {
              const k = ptKey(ev.isoDate);
              return k >= startKey && k <= endKey;
            });

            const withGames = TEAMS
              .map(t => ({team:t, games:thisWeek.filter(ev => matches(ev,t))}))
              .filter(x => x.games.length > 0);

            if (withGames.length === 0) {
              console.log('No games found. Email skipped.');
              return;
            }

            let tableRows = '';
            for (const {team, games} of withGames) {
              tableRows += '<tr><td colspan="5" style="padding:10px 16px 8px;background:#f5f5f5;border-top:3px solid '+team.color+';border-bottom:1px solid #e0e0e0">';
              tableRows += '<strong style="font-family:Arial,sans-serif;font-size:13px;color:#111111;text-transform:uppercase;letter-spacing:1px">'+team.name+'</strong>';
              tableRows += '<span style="font-family:Arial,sans-serif;font-size:10px;color:#666666;text-transform:uppercase;letter-spacing:2px;margin-left:10px">'+team.league+'</span>';
              tableRows += '</td></tr>';
              for (const ev of games) {
                const opp = opponent(ev, team);
                const vs  = homeTeam(ev,team) ? 'vs' : '@';
                const ch  = getChannel(ev.broadcast, ev.homeFull||'', ev.awayFull||'', ev.league);
                tableRows += '<tr style="border-bottom:1px solid #eeeeee;background:#ffffff">';
                tableRows += '<td style="padding:7px 16px;font-family:Arial,sans-serif;font-size:12px;color:#8a6000;font-weight:bold;white-space:nowrap">'+fmtDay(ev.isoDate)+'</td>';
                tableRows += '<td style="padding:7px 6px;font-family:Arial,sans-serif;font-size:12px;color:#555555;white-space:nowrap">'+fmtDate(ev.isoDate)+'</td>';
                tableRows += '<td style="padding:7px 6px;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;color:#0f0f0f">'+vs+' '+opp+'</td>';
                tableRows += '<td style="padding:7px 6px;font-family:Arial,sans-serif;font-size:12px;color:#555555;white-space:nowrap">'+fmtTime(ev.isoDate)+'</td>';
                tableRows += '<td style="padding:7px 16px 7px 4px;font-family:Arial,sans-serif;font-size:11px;color:#c9a84c;font-weight:bold;white-space:nowrap">'+ch+'</td>';
                tableRows += '</tr>';
              }
              tableRows += '<tr><td colspan="5" style="height:4px;background:#f5f5f5"></td></tr>';
            }

            const totalGames = withGames.reduce((s,x) => s+x.games.length, 0);

            const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"></head>'
              + '<body style="margin:0;padding:0;background:#ffffff;font-family:Arial,sans-serif">'
              + '<table width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;margin:0 auto;background:#ffffff;border:1px solid #e0e0e0">'
              + '<tr><td style="background:#0f0f0f;padding:18px 20px 14px;border-bottom:3px solid #c9a84c">'
              + '<table width="100%" cellpadding="0" cellspacing="0"><tr>'
              + '<td style="vertical-align:middle">'
              + '<div style="font-family:Arial,sans-serif;font-size:16px;font-weight:900;letter-spacing:3px;color:#f0ece3;text-transform:uppercase">OAKLAND ATHLETIC CLUB</div>'
              + '<div style="font-family:Arial,sans-serif;font-size:10px;letter-spacing:2px;color:#c9a84c;text-transform:uppercase;margin-top:2px">Priority Team Schedule - 59 Grand Ave</div>'
              + '</td>'
              + '<td style="text-align:right;vertical-align:middle">'
              + '<div style="font-family:Arial,sans-serif;font-size:11px;color:#c9a84c;text-transform:uppercase;letter-spacing:1px">Week of '+weekLabel+'</div>'
              + '<div style="font-family:Arial,sans-serif;font-size:10px;color:#666666;margin-top:2px">'+withGames.length+' teams - '+totalGames+' games</div>'
              + '</td></tr></table>'
              + '</td></tr>'
              + '<tr><td style="background:#ffffff">'
              + '<table width="100%" cellpadding="0" cellspacing="0">'+tableRows+'</table>'
              + '</td></tr>'
              + '<tr><td style="background:#0f0f0f;padding:12px 20px;border-top:1px solid #e0e0e0">'
              + '<p style="font-family:Arial,sans-serif;font-size:10px;color:#666666;margin:0;text-transform:uppercase;letter-spacing:1px">'
              + 'Oakland Athletic Club - <a href="https://oac59grand.github.io/bar-schedule/priority-schedule.html" style="color:#1d428a;text-decoration:none">View live schedule</a> - Updates hourly'
              + '</p></td></tr>'
              + '</table></body></html>';

            // Send via SendGrid HTTP API -- no SMTP auth issues
            const https2 = require('https');
            const emailData = JSON.stringify({
              personalizations: [{ to: process.env.EMAIL_TO.split(',').map(e => ({email: e.trim()})) }],
              from: { email: 'aaron@oaklandathleticclub.com', name: 'OAC Schedule' },
              reply_to: { email: process.env.SENDGRID_FROM || 'aaron@oaklandathleticclub.com' },
              subject: 'OAC Priority Teams - Week of ' + weekLabel + ' (' + withGames.length + ' teams, ' + totalGames + ' games)',
              content: [{ type: 'text/html', value: html }]
            });

            await new Promise((resolve, reject) => {
              const req = https2.request({
                hostname: 'api.sendgrid.com',
                path: '/v3/mail/send',
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + process.env.SENDGRID_API_KEY,
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(emailData),
                }
              }, res => {
                let body = '';
                res.on('data', c => body += c);
                res.on('end', () => {
                  if (res.statusCode === 202) {
                    console.log('Email sent: ' + withGames.length + ' teams, ' + totalGames + ' games');
                    resolve();
                  } else {
                    reject(new Error('SendGrid error ' + res.statusCode + ': ' + body));
                  }
                });
              });
              req.on('error', reject);
              req.write(emailData);
              req.end();
            });
          }

          main().catch(e => { console.error(e.message); process.exit(1); });
          ENDSCRIPT

      - name: Run email script
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
        run: node email_script.js
