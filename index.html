.day-btn:hover{background:#1a1a1a}
.day-btn.on{border-bottom-color:#c9a84c;background:#161410}
.day-name{font-size:9px;font-weight:800;letter-spacing:2px;color:#5a5248;text-transform:uppercase;margin-bottom:2px}

.day-num{font-size:24px;font-weight:900;color:#f0ece3;line-height:1}
.day-btn.on .day-num{color:#c9a84c}
.day-tag{font-size:8px;color:#c9a84c;margin-top:2px;height:10px}

// Broadcast classification -- returns {app, ch, cls, inPkg} or null if not in package
function classify(raw, homeFull, awayFull) {
  const hf = (homeFull || '').toLowerCase();
  const af = (awayFull || '').toLowerCase();
  const isGiantsGame = hf.includes('giants') || af.includes('giants');
  const isRootsGame  = hf.includes('roots')  || af.includes('roots');

  if (!raw) {
    if (isGiantsGame) return {app:'NBC Sports Bay Area', ch:'696', cls:'dtv', inPkg:true};
    if (isRootsGame)  return {app:'ESPN+', ch:'', cls:'epn', inPkg:true};
    return null;
  }

  // MLB.TV -- look up real DirecTV channel by team
  if (/mlb\.?tv/i.test(raw)) {
    if (isGiantsGame) return {app:'NBC Sports Bay Area + MLB.TV', ch:'696', cls:'dtv', inPkg:true};
    const info = getMlbChannel(homeFull || '', awayFull || '');
    return {app: info.net, ch: info.ch, cls:'dtv', inPkg:true};
  }

  // ESPN Unlimited = ESPN Ch 206
  if (/espn.?unl/i.test(raw)) return {app:'ESPN', ch:'206', cls:'espn', inPkg:true};

  // USA Network / USA Net = Ch 242 (in package)
  // Note: Bundesliga 2026-27 moved from ESPN+ to USA Network + Fandango (free)
  if (/^usa.?net(work)?$/i.test(raw)) return {app:'USA Network', ch:'242', cls:'dtv', inPkg:true};
  // Fandango -- free ad-supported streaming, no subscription needed
  if (/fandango/i.test(raw)) return {app:'Fandango (free stream)', ch:'', cls:'pmt', inPkg:true};

  // WNBA League Pass
  if (/wnba.?league|league.?pass/i.test(raw)) return {app:'WNBA League Pass', ch:'', cls:'wnba', inPkg:true};

  // Not in package
  if (/\bion\b|tennis.?ch|\bflo\b|willow|victory\+|fubo|hometeam/i.test(raw)) return null;

  // Streaming
  if (/peacock/i.test(raw))               return {app:'Peacock',       ch:'',    cls:'pkck', inPkg:true};
  if (/paramount/i.test(raw))             return {app:'Paramount+',    ch:'',    cls:'pmt',  inPkg:true};
  if (/espn\+|espnplus/i.test(raw))       return {app:'ESPN+',         ch:'',    cls:'epn',  inPkg:true};
  if (/prime|amazon/i.test(raw))          return {app:'Amazon Prime',  ch:'',    cls:'amz',  inPkg:true};
  if (/apple/i.test(raw))                 return {app:'Apple TV+',     ch:'',    cls:'apl',  inPkg:true};

  // Look up in channel map
  const key = raw.trim();
  if (CH[key]) return {app:key, ch:CH[key], cls:'dtv', inPkg:true};

  // Fuzzy match for common networks
  if (/^fox\b/i.test(raw))            return {app:'FOX',              ch:'2',   cls:'dtv',  inPkg:true};
  if (/^fs1\b/i.test(raw))            return {app:'FS1',              ch:'219', cls:'dtv',  inPkg:true};
  if (/^espn2\b/i.test(raw))          return {app:'ESPN2',            ch:'209', cls:'espn', inPkg:true};
  if (/^espn\b/i.test(raw))           return {app:'ESPN',             ch:'206', cls:'espn', inPkg:true};
  if (/^nbc\b/i.test(raw))            return {app:'NBC',              ch:'11',  cls:'dtv',  inPkg:true};
  if (/^cbs\b/i.test(raw))            return {app:'CBS',              ch:'5',   cls:'dtv',  inPkg:true};
  if (/^abc\b/i.test(raw))            return {app:'ABC',              ch:'7',   cls:'dtv',  inPkg:true};
  if (/^tnt\b/i.test(raw))            return {app:'TNT',              ch:'245', cls:'dtv',  inPkg:true};
  if (/^tbs\b/i.test(raw))            return {app:'TBS',              ch:'247', cls:'dtv',  inPkg:true};
  if (/nfl.?net/i.test(raw))          return {app:'NFL Network',      ch:'212', cls:'dtv',  inPkg:true};
  if (/mlb.?net/i.test(raw))          return {app:'MLB Network',      ch:'213', cls:'dtv',  inPkg:true};
  if (/nhl.?net/i.test(raw))          return {app:'NHL Network',      ch:'215', cls:'dtv',  inPkg:true};
  if (/nba.?tv/i.test(raw))           return {app:'NBA TV',           ch:'216', cls:'dtv',  inPkg:true};
  if (/golf.?ch/i.test(raw))          return {app:'Golf Channel',     ch:'218', cls:'dtv',  inPkg:true};
  if (/cbs.?sports/i.test(raw))       return {app:'CBS Sports Net',   ch:'221', cls:'dtv',  inPkg:true};
  if (/^tele(mundo)?$/i.test(raw))     return {app:'Telemundo',          ch:'406', cls:'dtv',  inPkg:true};
  if (/universo/i.test(raw))           return {app:'UNIVERSO',            ch:'410', cls:'dtv',  inPkg:true};
  if (/unimas/i.test(raw))             return {app:'UniMas',              ch:'408', cls:'dtv',  inPkg:true};
  if (/nbcs|nbc.?sports.?bay/i.test(raw)) return {app:'NBC Sports Bay Area', ch:'696', cls:'dtv', inPkg:true};
  if (/tennis.?ch/i.test(raw))         return {app:'Tennis Channel',      ch:'217', cls:'dtv',  inPkg:true};
  if (/espn.?dep/i.test(raw))          return {app:'ESPN Deportes',       ch:'466', cls:'dtv',  inPkg:true};
  if (/fox.?dep/i.test(raw))           return {app:'FOX Deportes',        ch:'465', cls:'dtv',  inPkg:true};
  if (/^tudn$/i.test(raw))             return {app:'TUDN',                ch:'464', cls:'dtv',  inPkg:true};
  if (/tyc/i.test(raw))                return {app:'TyC Sports',          ch:'469', cls:'dtv',  inPkg:true};

  return null;
}

// Team detection
const isGiants    = e => (e.homeFull+e.awayFull).includes('Giants');
const isF1        = e => e.league === 'Formula 1';
const isNascar    = e => e.league === 'NASCAR';
const isFirebells = e => (e.homeFull+e.awayFull+e.home+e.away).includes('Firebells');
const isSoul      = e => (e.homeFull+e.awayFull+e.home+e.away).includes('Soul');
const isValk     = e => (e.homeFull+e.awayFull).includes('Valkyries');
const isWarriors = e => (e.homeFull+e.awayFull).includes('Warriors');
const isRoots    = e => (e.homeFull+e.awayFull).includes('Roots');
const isBallers  = e => (e.homeFull+e.awayFull).includes('Ballers');
const isBayFC    = e => (e.homeFull+e.awayFull).includes('Bay FC') || (e.homeFull+e.awayFull).includes('Bay F.C.');

function getAccentClass(ev) {
  if (ev.league === 'World Cup' || ev.league === 'Wimbledon') return 'acc-gold';
  if (isGiants(ev))   return 'acc-red';
  if (isValk(ev))     return 'acc-blue';
  if (isRoots(ev))      return 'acc-green';
  if (isF1(ev))         return 'acc-f1';
  if (isNascar(ev))     return 'acc-nascar';
  if (isFirebells(ev))  return 'acc-fire';
  if (isSoul(ev))       return 'acc-soul';
  if (isBallers(ev))  return 'acc-dkgreen';
  if (isBayFC(ev))    return 'acc-navy';
  if (ev.women)       return 'acc-purple';
  return '';
}

function pillCls(cls) {
  const m = {dtv:'p-dtv', espn:'p-espn', epn:'p-epn', pkck:'p-pkck',
             pmt:'p-pmt', amz:'p-amz', apl:'p-apl', wnba:'p-wnba'};
  return m[cls] || 'p-dtv';
}

function matchup(ev) {
  return (ev.homeScore !== null && ev.status !== 'pre')
    ? `${ev.away} ${ev.awayScore} - ${ev.homeScore} ${ev.home}`
    : `${ev.away} vs ${ev.home}`;
}

// Date helpers
function ymd(d) {
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}
function dk(d) {
  const s = ymd(d);
  return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`;
}
function addDays(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d;
}

// Process a raw event object (from either ESPN API or schedule.json)
function processEv(raw) {
  const dt = new Date(raw.isoDate);
  const bc = classify(raw.broadcast, raw.homeFull || raw.home, raw.awayFull || raw.away);
  if (!bc) return null;
  return Object.assign({}, raw, {
    timeStr:  dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}),
    hour:     dt.getHours(),
    app:      bc.app,
    ch:       bc.ch,
    cls:      bc.cls,
    inPkg:    bc.inPkg,
    homeFull: raw.homeFull || raw.home || '',
    awayFull: raw.awayFull || raw.away || '',
  });
}

// Inject supplemental events into the cache for a given date key
function injectSupp(cache, key) {
  if (!cache[key]) cache[key] = [];
  for (const s of SUPP) {
    if (s.date !== key) continue;
    const processed = processEv({
      ...s,
      homeFull: s.homeFull || s.home,
      awayFull: s.awayFull || s.away,
      homeScore: null, awayScore: null, status:'pre',
    });
    if (processed && !cache[key].some(e => e.league === s.league && e.detail === s.detail)) {
      cache[key].push(processed);
    }
  }
  cache[key].sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));
}








const PROXIES = [
  u => u,
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
];
let px = 0;
async function espnFetch(path, dateStr) {
  const base = 'https://site.api.espn.com/apis/site/v2/sports/' + path + '/scoreboard?dates=' + dateStr;
  for (let i = px; i < PROXIES.length; i++) {
    try {
      const r = await fetch(PROXIES[i](base), {cache:'no-store'});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      px = i;
      return j;
    } catch(e) {}
  }
  throw new Error('all proxies failed');
}

const cache = {};

async function loadDay(d) {
  const key = dk(d);
  if (cache[key]) return cache[key];
  const dates = [-1,0,1].map(i => { const x=new Date(d); x.setDate(x.getDate()+i); return ymd(x); });
  cache[key] = [];
  await Promise.all(LEAGUES.map(async lg => {
    for (const dateStr of dates) {
      try {
        const json = await espnFetch(lg.espn, dateStr);
        for (const ev of (json.events || [])) {
          try {
            const comp = ev.competitions[0];
            const home = comp.competitors.find(c => c.homeAway === 'home');
            const away = comp.competitors.find(c => c.homeAway === 'away');
            const dt = new Date(ev.date);
            if (dk(dt) !== key) continue;
            let raw = null;
            try {
              if (comp.broadcasts && comp.broadcasts.length)
                raw = comp.broadcasts[0].names?.[0] || comp.broadcasts[0].media?.shortName || null;
              if (!raw && comp.geoBroadcasts && comp.geoBroadcasts.length)
                raw = comp.geoBroadcasts[0].media?.shortName || null;
            } catch(e) {}
            const p = processEv({
              league:lg.label, women:lg.women,
              home:home.team.shortDisplayName||home.team.abbreviation||'',
              away:away.team.shortDisplayName||away.team.abbreviation||'',
              homeFull:home.team.displayName||'',
              awayFull:away.team.displayName||'',
              homeScore:home.score!==undefined?parseInt(home.score):null,
              awayScore:away.score!==undefined?parseInt(away.score):null,
              status:ev.status.type.state,
              detail:ev.status.type.shortDetail||'',
              isoDate:ev.date,
              venue:comp.venue?comp.venue.fullName:'',
              broadcast:raw,
            });
            if (p && !cache[key].some(e=>e.home===p.home&&e.away===p.away&&e.isoDate===p.isoDate))
              cache[key].push(p);
          } catch(e) {}
        }
      } catch(e) {}
    }
  }));
  injectSupp(cache, key);
  return cache[key];
}

function buildScores(evs) {
  const live=evs.filter(e=>e.status==='in'),fin=evs.filter(e=>e.status==='post'),pre=evs.filter(e=>e.status==='pre');
  function cards(arr){ return arr.map(g=>'<div class="score-card'+(g.status==='in'?' live':'')+'"><div class="sc-league">'+g.league+(g.status==='in'?' &middot; LIVE':g.status==='post'?' &middot; Final':'')+'</div><div class="sc-match">'+matchup(g)+'</div><div class="sc-detail">'+g.detail+'</div></div>').join(''); }
  let h='';
  if(live.length)  h+='<div class="sec-lbl">Live Now</div><div class="score-grid">'+cards(live)+'</div>';
  if(fin.length)   h+='<div class="sec-lbl">Final</div><div class="score-grid">'+cards(fin)+'</div>';
  if(pre.length)   h+='<div class="sec-lbl">Upcoming</div><div class="score-grid">'+cards(pre)+'</div>';
  return h||'<div class="empty">No scores yet.</div>';
}

let curDay=0, curTab='all';
function buildDays(){
  document.getElementById('days').innerHTML=Array.from({length:7},(_,i)=>{
    const d=addDays(i),k=dk(d),hasWC=cache[k]?.some(e=>e.league==='World Cup'||e.league==='Wimbledon');
    return '<button class="day-btn'+(i===curDay?' on':'')+'" onclick="goDay('+i+')">' +
      '<div class="day-name">'+(i===0?'Today':d.toLocaleDateString('en-US',{weekday:'short'}))+'</div>' +
      '<div class="day-num">'+d.getDate()+'</div>' +
      '<div class="day-tag">'+(hasWC?'WC':'')+'</div></button>';
  }).join('');
}
function setTab(tab,el){
  curTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(el) el.classList.add('on');
  renderContent();
}
function renderContent(){
  const key=dk(addDays(curDay)), evs=cache[key]||[];
  const sched=document.getElementById('sched');
  if(curTab==='scores'){sched.innerHTML='<div class="sched-hd"><span>Scores</span></div>'+buildScores(evs);return;}
  let filtered=evs;
  if(curTab==='women') filtered=evs.filter(e=>e.women||isValk(e)||isBayFC(e));
  if(curTab==='world') filtered=evs.filter(e=>e.league==='World Cup'||e.league==='Wimbledon');
  const d=addDays(curDay);
  const ds=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  sched.innerHTML=filtered.length
    ?'<div class="sched-hd"><span>Schedule</span><span class="sched-date">'+ds+'</span></div><div class="games">'+filtered.map(buildRow).join('')+'</div>'
    :'<div class="empty">No games'+(curTab!=='all'?' in this category':'')+' today.</div>';
}
async function goDay(n){
  curDay=n; buildDays(); renderContent();
  if(!cache[dk(addDays(n))]) await loadAndRender();
}
async function loadAndRender(){
  const d=addDays(curDay);
  document.getElementById('status').textContent='Loading...';
  try{
    await loadDay(d);
    document.getElementById('feat').innerHTML=buildFeat(cache[dk(d)]||[]);
    renderContent(); buildDays();
    const n=(cache[dk(d)]||[]).length;
    document.getElementById('status').textContent=n+' game'+(n!==1?'s':'')+' \u2022 Updated '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})+' PT';
  }catch(e){document.getElementById('status').textContent='Error loading - will retry';}
}
function updateClock(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});}
async function init(){
  buildDays(); updateClock(); setInterval(updateClock,1000);
  await loadAndRender();
  for(let i=1;i<7;i++) loadDay(addDays(i)).then(()=>buildDays()).catch(()=>{});
  setInterval(()=>{Object.keys(cache).forEach(k=>delete cache[k]);loadAndRender();},300000);
}
init();






</script>
